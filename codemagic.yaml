
workflows:
  maram-ios:
    name: MARAM iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: 26.5
      node: 22

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Build iOS app without signing
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          APP_PATH="build/ios/Build/Products/Debug-iphoneos/App.app"
          test -d "$APP_PATH" || { echo "ERROR: App.app was not produced"; exit 1; }
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/App.app
          cd build/ios/ipa
          /usr/bin/zip -qry MARAM-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
